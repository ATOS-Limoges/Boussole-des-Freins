name: Actualiser les événements emploi

on:
  schedule:
    - cron: '15 5 * * *'   # chaque jour, vers 6 h 15 / 7 h 15 (heure de Paris)
  workflow_dispatch:        # permet aussi de le lancer à la main (onglet Actions)

permissions:
  contents: write

concurrency:
  group: update-evenements
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Interroger l'API et régénérer evenements.json
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_SCOPE: ${{ vars.FT_SCOPE }}
          FT_EVENTS_URL: ${{ vars.FT_EVENTS_URL }}
          FT_EVENTS_QUERY: ${{ vars.FT_EVENTS_QUERY }}
          DEBUG: ${{ vars.DEBUG }}
        run: node scripts/update-evenements.mjs
      - name: Enregistrer si la liste a changé
        run: |
          if [ -n "$(git status --porcelain evenements.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evenements.json
            git commit -m "Actualisation des événements emploi"
            git push
          else
            echo "Aucun changement."
          fi
