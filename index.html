img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;color:var(--marine);text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(18px,env(safe-area-inset-right,0px)) 56px max(18px,env(safe-area-inset-left,0px))}

/* ---------- bandeau d'application ---------- */
.app-topbar{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(115deg,var(--marine),var(--marine-2));color:#fff;border-bottom:3px solid var(--laiton)}
@media(min-width:601px){.app-topbar{padding-left:max(24px,calc((100vw - 1180px)/2 + 18px));padding-right:max(24px,calc((100vw - 1180px)/2 + 18px))}}
.app-logo{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:23px;background:rgba(255,255,255,.08);border:2px solid var(--laiton-clair)}
.app-brand{min-width:0;flex:1}
.app-brand strong{display:block;font:700 19px/1.15 var(--display);color:#fff}
.app-brand span{display:block;margin-top:3px;font-size:12.5px;letter-spacing:.03em;color:#C4D7DF;text-wrap:balance}
.app-top-pill{white-space:nowrap;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--laiton-clair);border:1px solid rgba(240,203,119,.6)}

/* ---------- navigation (fil d'Ariane) ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(245,248,245,.95);border-bottom:1px solid var(--line)}
.nav .wrap{padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;font:700 16px/1 var(--body);color:var(--marine);background:var(--surface);border:1.5px solid var(--marine);border-radius:999px;cursor:pointer}
.btn:hover{background:#E3EEF1}
.btn.primary{background:var(--marine);color:#fff}
.btn.primary:hover{background:var(--marine-2)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;font-size:15px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:700}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs .sep{color:var(--laiton);font-weight:700}
.crumbs .here{color:var(--ink);font-weight:700}
.navbtns{margin-left:auto;display:flex;gap:8px}

/* ---------- accueil : la boussole ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,3.5vw,44px);align-items:start}
.eyebrow{font-size:15px;font-weight:700;color:var(--muted)}
.intro p{color:var(--muted);max-width:56ch}
.wheel-stage{position:relative;padding:clamp(10px,2vw,22px);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:
    linear-gradient(rgba(11,43,61,.05) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(11,43,61,.05) 1px,transparent 1px) 0 0/32px 32px,
    radial-gradient(circle at 50% 45%,#fff 0,#EFF5F1 78%)}
@media(min-width:821px){.wheel-stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}}
.wheel-cap{margin:6px 8px 2px;text-align:center;font-size:15px;color:var(--muted)}
.events-panel{margin:22px auto 4px;max-width:620px;padding:18px;background:linear-gradient(145deg,#fff,#f3f8f7);border:1px solid var(--line);border-radius:22px;text-align:left}
.events-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--marine)}
.events-heading>span{font-size:25px}
.events-heading h2{font-size:18px;line-height:1.2;margin:0;font-family:var(--display)}
.events-heading p{font-size:12px;color:var(--muted);margin:4px 0 0}
.events-list{display:grid;gap:10px}
.event-card{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid #dce8e5;border-radius:15px}
.event-date{flex:0 0 52px;align-self:flex-start;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--marine);color:#fff;border-radius:12px;padding:8px 4px}
.event-date strong{font-size:23px;line-height:1.05}.event-date span{font-size:12px;font-weight:800;letter-spacing:.08em;margin-top:3px}
.event-info{min-width:0}.event-info h3{font-size:14px;line-height:1.35;margin:0 0 6px;color:var(--ink)}
.event-info p{font-size:13px;line-height:1.45;color:var(--muted);margin:0 0 7px}
.event-info a,.events-all{display:inline-block;padding:7px 0;font-size:13px;font-weight:800;color:var(--marine);text-decoration:underline;text-underline-offset:3px}
.events-all{display:block;text-align:center;margin-top:14px;font-size:13px}
.events-update{font-size:12px;line-height:1.4;color:var(--muted);margin:12px 0 0}
@media(max-width:520px){.events-panel{padding:13px;margin-top:16px;border-radius:18px}.events-heading h2{font-size:16px}.event-card{gap:9px;padding:10px}.event-date{flex-basis:44px}.event-date strong{font-size:21px}.event-info h3{font-size:14px}.event-info p{font-size:13px}}
/* Sur ordinateur, les événements retrouvent leur place sous la roue. */
.desktop-events{display:block;margin:18px 0 0;max-width:none;padding:16px}
@media(max-width:820px){.desktop-events{display:none}}
/* Sur ordinateur, les événements sont affichés sous la roue uniquement, pas dans la colonne de droite. */
@media(min-width:821px){#mobile-panel-events{display:none!important}}
.wheel{display:block;width:100%;max-width:580px;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(11,43,61,.2))}
.wheel a{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wheel .seg{outline:none}
.wheel .seg path{transition:transform .22s ease,filter .22s}
@media(hover:hover){.wheel .seg:hover path{transform:scale(1.03);filter:brightness(1.1)}}
.wheel .seg:focus-visible path{stroke:#fff;stroke-width:5;transform:scale(1.03)}
.wheel text{font-family:var(--body);font-weight:700;fill:#fff;pointer-events:none;letter-spacing:.01em}
.wheel .seg text{stroke:rgba(0,0,0,.16);stroke-width:2px;paint-order:stroke;stroke-linejoin:round}
.wheel .hub{fill:#fff;stroke:var(--laiton);stroke-width:4}
.wheel .hubtxt{fill:var(--marine);font-family:var(--display);font-size:18px;font-weight:700}
.wheel .hubsub{fill:var(--muted);font-family:var(--body);font-size:15px}
.wheel .bz{fill:#fff;font-family:var(--display);font-size:18px}
.wheel .needle{transform-box:fill-box;transform-origin:50% 50%;animation:settle 2.2s cubic-bezier(.22,.8,.3,1) .2s both}
@keyframes settle{0%{transform:rotate(-65deg)}30%{transform:rotate(22deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}

.intro-copy{padding:clamp(22px,3.2vw,38px);border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#FAEFCF;color:var(--warn-ink);font-weight:700;font-size:14px}
.intro-kicker .spark{color:var(--laiton);font-size:16px}
.intro h1{margin:14px 0 12px;font-size:clamp(34px,4.6vw,52px);letter-spacing:-.015em;font-variation-settings:"opsz" 120}
.intro-lead{font-size:clamp(17px,1.6vw,19px);line-height:1.55}

/* Onglets de l'accueil : visibles uniquement sur mobile */
.mobile-tabs{display:none}
.home-panel{min-width:0}

/* recherche */
.search-panel{margin-top:22px;padding:18px;border-radius:20px;background:var(--papier);border:1px solid var(--line)}
.search-title{display:flex;align-items:center;gap:9px;margin-bottom:10px;font:700 18px/1.3 var(--display);color:var(--marine)}
.search-field{display:flex;align-items:center;gap:10px;padding:0 14px;border:2px solid var(--marine);border-radius:14px;background:#fff}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,92,116,.2)}
.search-field span{font-size:20px;color:var(--marine)}
.search-field input{width:100%;min-width:0;padding:14px 0;border:0;outline:0;background:transparent;color:var(--ink);font:17px var(--body)}
.search-field input::placeholder{color:#5B6E76}
.search-hint{margin:8px 2px 0;font-size:14px;color:var(--muted)}
.search-results{display:grid;gap:8px;margin-top:12px}
.search-result{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}
.search-result:hover{border-color:var(--accent)}
.search-result .result-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;background:var(--papier);font-size:23px}
.search-result .result-copy{min-width:0;flex:1}
.search-result strong{display:block;line-height:1.3;font-size:16.5px}
.search-result small{display:block;margin-top:3px;font-size:14px;color:var(--muted)}
.search-result .arrow{font-size:20px;color:var(--f6)}
.search-empty{padding:14px;border-radius:12px;background:#fff;border:1px dashed var(--line);font-size:15px;color:var(--muted)}

/* liste des freins (alternative lisible à la boussole) */
@media(min-width:821px){#mobile-panel-categories .intro-kicker{margin-top:28px}}
.ft-directory .ft-agency-grid ~ p.muted{margin:6px 0 0}
.ft-directory .ft-agency-grid + p.muted{margin-top:14px}
.legend{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.legend a{display:flex;align-items:center;gap:11px;min-height:64px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-left:6px solid var(--icon-color,var(--accent));border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:16.5px;line-height:1.25}
.legend a:active{background:var(--papier)}
@media(hover:hover){.legend a:hover{background:var(--papier);box-shadow:var(--shadow)}}
.legend .visual-mark{width:42px;height:42px;border-radius:12px;font-size:23px}
.legend a>span:not(.n):not(.visual-mark){min-width:0;overflow-wrap:anywhere;hyphens:auto}
@media(min-width:821px){.legend a{gap:9px;padding:10px 10px 10px 9px;font-size:15.5px}.legend .visual-mark{width:38px;height:38px;font-size:21px}}
.legend .n{margin-left:auto;flex:none;display:inline-flex;gap:.3em;white-space:nowrap;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--papier);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.legend .n .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.25)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 16px;border-radius:12px;border-left:5px solid var(--laiton);background:var(--warn-bg);color:var(--warn-ink);font-size:15px}

/* ---------- pages « frein » et listes ---------- */
.head{display:flex;gap:18px;align-items:center;margin:8px 0 24px;padding:20px 22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.badge{width:72px;height:72px;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-size:32px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3),0 4px 12px rgba(11,43,61,.2)}
.head h1{font-size:clamp(30px,4vw,44px)}
.head p{margin:6px 0 0;max-width:62ch;color:var(--muted)}
.tag{display:inline-block;margin-bottom:2px;font-size:14px;font-weight:700;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:190px;padding:20px 20px 18px 22px;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:20px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:box-shadow .18s,transform .18s}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(11,43,61,.14)}}
.card:active{background:var(--papier)}
.card-top{display:flex;align-items:center;gap:12px}
.card h2{font-size:21px;font-weight:600}
.card p{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.card .go{display:flex;align-items:center;gap:7px;margin-top:auto;font-weight:700;font-size:16px;color:var(--accent)}
.card .go span{transition:transform .18s}
.card:hover .go span{transform:translateX(3px)}
.visual-mark{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:13px;font-size:24px;line-height:1;background:color-mix(in srgb,var(--c,var(--accent)) 14%,#fff)}
.card .visual-mark{width:48px;height:48px}
.cat{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px;padding-bottom:8px;border-bottom:3px solid var(--c);font-size:23px}
.cat .n{font-size:14px;font-weight:700;color:var(--muted)}

/* ---------- fiche ---------- */
.fh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 20px}
.fh h1{width:100%;display:flex;align-items:center;gap:12px;font-size:clamp(28px,4vw,42px)}
.pill{padding:4px 11px;border-radius:999px;background:var(--c);color:#fff;font-size:14px;font-weight:700}
.fiche{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.panel h2{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:21px}
.panel section+section{margin-top:24px;padding-top:22px;border-top:2px dashed #BCCBC4}
.panel p{margin:0;max-width:68ch}
.panel ul{margin:8px 0 0;padding-left:22px}
.panel li{margin:5px 0}
.panel.defn{margin:0 0 22px}
.defn li strong{color:var(--marine)}
.panel li::marker{color:var(--c,var(--accent))}
.section-icon{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;font-size:18px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,#fff)}
.contact{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;border-color:var(--marine);border-top:6px solid var(--c);background:linear-gradient(160deg,var(--marine),var(--marine-2));color:#EAF2F5}
.contact h2{color:#fff}
.contact h2:before{content:"📍";font-size:20px}
.contact dl{margin:0;display:grid;gap:14px}
.contact dt{font-size:14px;font-weight:700;color:#A9C6D3}
.contact dd{margin:2px 0 0;overflow-wrap:anywhere}
.contact a{color:var(--laiton-clair)}
.todo{padding:2px 9px;border-radius:7px;background:var(--warn-bg);color:var(--warn-ink);font-size:15px;font-style:italic}
.view{animation:in .2s ease}
@keyframes in{from{opacity:.3}to{opacity:1}}

/* ---------- navigation par onglets pour mobile et vues compactes ---------- */
@media(max-width:820px){

@media(prefers-reduced-motion:reduce){

/* ---------- écran d'accueil animé : Boussole x ATOS ---------- */
#brand-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:radial-gradient(circle at 50% 40%,#17465b 0%,#0B2B3D 62%,#071c28 100%);color:#fff;opacity:1;visibility:visible;overflow:hidden;cursor:pointer;transition:opacity .6s ease,visibility .6s ease}
#brand-splash.leaving{opacity:0;visibility:hidden;pointer-events:none}
#brand-splash .splash-compass::before{content:"";position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;background:conic-gradient(from 0deg,transparent 0 85%,#f0cb7722 92%,transparent 100%);animation:splash-sweep 5s linear infinite;pointer-events:none;z-index:-1}
#brand-splash .splash-compass{position:relative;width:clamp(150px,34vw,210px);height:clamp(150px,34vw,210px);opacity:0;transform:scale(.88);animation:splash-in .65s .05s cubic-bezier(.2,.8,.2,1) forwards}
#brand-splash .splash-compass svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 28px #00b6a433)}
#brand-splash .sc-ring{fill:none;stroke:#B07D1E;stroke-width:3;stroke-dasharray:578;stroke-dashoffset:578;animation:splash-draw .8s .1s ease-out forwards}
#brand-splash .sc-face{fill:#ffffff08;stroke:#ffffff1a;stroke-width:1}
#brand-splash .sc-ticks{fill:none;stroke:#f0cb77;stroke-width:4;stroke-dasharray:1.3 4.63;opacity:0;animation:splash-fade .45s .5s ease forwards}
#brand-splash .sc-cardinal{fill:#f0cb77;font:700 14px system-ui,sans-serif;text-anchor:middle;opacity:0;animation:splash-fade .45s .65s ease forwards}
#brand-splash .sc-needle{transform-origin:100px 100px;transform:rotate(-260deg);animation:splash-needle 1.4s .25s cubic-bezier(.22,1,.36,1) forwards}
#brand-splash .sc-n{fill:#E2574A}
#brand-splash .sc-s{fill:#e8f0f2}
#brand-splash .sc-pin{fill:#B07D1E;stroke:#0B2B3D;stroke-width:2}
#brand-splash .splash-title{font-weight:800;font-size:clamp(20px,4vw,28px);text-align:center;letter-spacing:.02em;opacity:0;transform:translateY(10px);animation:splash-up .6s .9s ease forwards}
#brand-splash .splash-line{height:2px;width:0;border-radius:2px;background:linear-gradient(90deg,transparent,#f0cb77,transparent);animation:splash-line .65s 1.2s ease forwards}
#brand-splash .powered{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:#b9cfd7;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:translateY(10px);animation:splash-up .65s 1.5s ease forwards}
#brand-splash .powered img{width:84px;height:auto;max-height:126px;object-fit:contain;border-radius:8px;background:#fff;padding:5px 7px;box-shadow:0 6px 22px #0006,0 0 0 1px #ffffff22;animation:splash-glow 2.4s 1.9s ease-in-out infinite}
#brand-splash .splash-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#B07D1E,#f0cb77,#00b6a4);animation:splash-bar 3s 0s linear forwards}
@keyframes splash-in{to{opacity:1;transform:scale(1)}}
@keyframes splash-draw{to{stroke-dashoffset:0}}
@keyframes splash-fade{to{opacity:1}}
@keyframes splash-up{to{opacity:1;transform:translateY(0)}}
@keyframes splash-line{to{width:min(260px,58vw)}}
@keyframes splash-bar{to{transform:scaleX(1)}}
@keyframes splash-sweep{to{transform:rotate(360deg)}}
@keyframes splash-glow{0%,100%{box-shadow:0 6px 22px #0006,0 0 0 1px #ffffff22}50%{box-shadow:0 6px 26px #0006,0 0 0 1px #f0cb7788,0 0 22px #f0cb7744}}
@keyframes splash-needle{0%{transform:rotate(-260deg)}55%{transform:rotate(14deg)}72%{transform:rotate(-7deg)}86%{transform:rotate(3deg)}100%{transform:rotate(0deg)}}
@media(prefers-reduced-motion:reduce){#brand-splash .splash-compass::before{animation:none}#brand-splash *{animation-duration:.01s!important;animation-delay:0s!important}#brand-splash .splash-line{width:min(260px,58vw)}}

/* ---------- édition saisonnière : Halloween mignon, boussole préservée ---------- */
body.halloween-theme{
  --brume:#F4EDF8; --papier:#FBF7FD; --surface:#FFFCFF;
  --marine:#34204D; --marine-2:#56356D; --ink:#291D35; --muted:#66556F; --line:#DED0E8;
  --accent:#75449A; --laiton:#E88A2E; --laiton-clair:#FFD18A; --nord:#F07836;
  --warn-bg:#FFF0DA; --warn-ink:#6C3D13;
  --shadow:0 2px 0 rgba(52,32,77,.04),0 10px 28px rgba(52,32,77,.10);
  background:linear-gradient(180deg,#F7F0FA 0%,#F4EDF8 48%,#FFF8F0 100%);
}
body.halloween-theme::before{
  opacity:.28;
  filter:hue-rotate(235deg) saturate(.8);
}
body.halloween-theme .app-topbar{
  background:linear-gradient(115deg,#251635 0%,#422555 68%,#5C356C 100%);
  border-bottom:3px solid #F29A45;
  position:relative; overflow:hidden;
}
body.halloween-theme .app-topbar::after{
  content:"✦  🦇  ✦";
  margin-left:auto; padding-left:8px; color:#FFD18A;
  font-size:clamp(16px,2.2vw,23px); letter-spacing:.12em;
  white-space:nowrap; opacity:.95;
}
body.halloween-theme .btn.primary,
body.halloween-theme .mobile-tab[aria-selected="true"]{
  background:#56356D; border-color:#56356D;
}
body.halloween-theme .events-panel{
  background:linear-gradient(145deg,#FFFCFF,#F4EAF9 65%,#FFF1DE);
  border-color:#D9C3E6; box-shadow:0 8px 24px #34204d12;
}
body.halloween-theme .events-heading>span{filter:saturate(.9)}
body.halloween-theme .event-card{
  background:#FFFEFF; border-color:#E2D2EC; box-shadow:0 3px 10px #34204d0a;
}
body.halloween-theme .event-date{
  background:linear-gradient(160deg,#56356D,#34204D);
  box-shadow:inset 0 -3px 0 #F29A45;
}
body.halloween-theme .event-info a,
body.halloween-theme .events-all{color:#653985}
body.halloween-theme .app-topbar .btn{
  border-color:#FFD18A;
}
body.halloween-theme #brand-splash{
  background:
    radial-gradient(circle at 50% 35%,#56356D 0%,#34204D 52%,#1D1428 100%);
}
body.halloween-theme #brand-splash::after{
  content:"✦  🦇  👻  🎃  🦇  ✦";
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 22px);
  left:0; right:0; text-align:center; font-size:clamp(20px,4vw,30px);
  letter-spacing:.18em; opacity:.95; pointer-events:none;
  animation:spooky-float 3s ease-in-out infinite;
}
body.halloween-theme #brand-splash .sc-ring{stroke:#F29A45}
body.halloween-theme #brand-splash .sc-ticks,
body.halloween-theme #brand-splash .sc-cardinal{stroke:#FFD18A;fill:#FFD18A}
body.halloween-theme #brand-splash .sc-n{fill:#F07836}
body.halloween-theme #brand-splash .sc-s{fill:#F0E5F8}
body.halloween-theme #brand-splash .sc-pin{fill:#FFD18A;stroke:#34204D}
body.halloween-theme #brand-splash .splash-line{
  background:linear-gradient(90deg,transparent,#F29A45,#FFD18A,transparent)
}
body.halloween-theme #brand-splash .splash-bar{
  background:linear-gradient(90deg,#F07836,#FFD18A,#9B70BC)
}
@keyframes spooky-float{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){body.halloween-theme #brand-splash::after{animation:none}}


/* ---------- ciel d'orage : nuages sombres animés et éclairs (haut de page) ---------- */
body.halloween-theme .app-topbar{isolation:isolate;padding-top:calc(env(safe-area-inset-top,0px) + 44px)}
body.halloween-theme .app-topbar::after{position:relative;z-index:1}
body:not(.halloween-theme) .storm{display:none}
.storm{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;

/* éclairs : double éclat très bref, à intervalles irréguliers (jamais plus de 2 éclats par seconde) */
.storm-flash,.storm-bolt{position:absolute;opacity:0;animation:storm-strike 13s linear infinite}
.storm-flash{top:0;bottom:0;width:70%;
  background:radial-gradient(ellipse at 50% 0%,rgba(236,226,255,.62) 0%,rgba(176,150,240,.26) 38%,transparent 72%)}
.storm-bolt{top:20px;height:calc(100% - 20px);width:34px;max-height:92px;
  filter:drop-shadow(0 0 4px #E7DBFF) drop-shadow(0 0 10px rgba(176,150,240,.9))}
.storm-bolt svg{display:block;width:100%;height:100%}
.storm-bolt path{fill:none;stroke:#FFFCF2;stroke-width:2.4;stroke-linejoin:miter;stroke-linecap:round}
.storm-flash.a{left:-10%;animation-duration:13s;animation-delay:3s}
.storm-bolt.a{left:26%;animation-duration:13s;animation-delay:3s}
.storm-flash.b{right:-10%;animation-duration:19s;animation-delay:9s}
.storm-bolt.b{left:68%;animation-duration:19s;animation-delay:9s}
.storm-flash.c{left:15%;width:60%;animation-duration:29s;animation-delay:17s}
.storm-bolt.c{left:46%;animation-duration:29s;animation-delay:17s}

  .storm-layer{animation:none}
  .storm-flash,.storm-bolt{display:none}
}

/* ---------- le chat noir qui traverse le bas de la page (après 20 s d'inactivité) ---------- */
body:not(.halloween-theme) #hw-cat{display:none}
#hw-cat{position:fixed;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);width:80px;z-index:4;pointer-events:none;
  transform:translate3d(-140px,0,0);will-change:transform;filter:drop-shadow(0 2px 2px rgba(52,32,77,.28))}
#hw-cat .cat-flip{display:block}
#hw-cat.rtl .cat-flip{transform:scaleX(-1)}
#hw-cat svg{display:block;width:100%;height:auto;overflow:visible}
#hw-cat.walk{animation:cat-ltr var(--cat-dur,22s) linear forwards}
#hw-cat.walk.rtl{animation-name:cat-rtl}
@keyframes cat-ltr{from{transform:translate3d(-140px,0,0)}to{transform:translate3d(calc(100vw + 140px),0,0)}}
@keyframes cat-rtl{from{transform:translate3d(calc(100vw + 140px),0,0)}to{transform:translate3d(-140px,0,0)}}
#hw-cat .leg{animation:cat-step .38s ease-in-out infinite alternate}
#hw-cat .leg.l-b,#hw-cat .leg.l-c{animation-delay:-.38s}
#hw-cat .cat-bob{animation:cat-bob .38s ease-in-out infinite alternate}
#hw-cat .cat-tail{transform-origin:26px 31px;animation:cat-tail 1.3s ease-in-out infinite alternate}
@keyframes cat-step{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes cat-bob{from{transform:translateY(0)}to{transform:translateY(-1.3px)}}
@keyframes cat-tail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
/* poses du chat : s'asseoir et se lécher la patte, ou s'arrêter et miauler */
#hw-cat .cat-haunch,#hw-cat .cat-paw,#hw-cat .cat-mouth{opacity:0}
#hw-cat .cat-haunch{transition:opacity .2s}
#hw-cat .leg{transition:opacity .2s}
#hw-cat .cat-paw{transform:translate(74px,37px) rotate(-110deg)}
#hw-cat .cat-mouth{transform-origin:91px 26.5px}
#hw-cat.stop .leg,#hw-cat.stop .cat-bob{animation:none}
#hw-cat.sit .leg{animation:none}
#hw-cat.sit .leg.l-a,#hw-cat.sit .leg.l-b{opacity:0}
#hw-cat.sit .cat-haunch{opacity:1}
#hw-cat.sit .cat-bob{transform-origin:36px 50px}
#hw-cat.sit-in .cat-bob{animation:cat-bob-sit .45s ease-out forwards}
#hw-cat.sit-in .leg.l-c,#hw-cat.sit-in .leg.l-d{animation:cat-leg-sit .45s ease-out forwards}
#hw-cat.sit-in .cat-tail{animation:cat-tail-in .45s ease-out forwards}
#hw-cat.lick .cat-bob{animation:cat-bob-lick .9s ease-in-out infinite alternate}
#hw-cat.lick .leg.l-c{transform:translateY(-9px) scaleY(1.53)}
#hw-cat.lick .leg.l-d{opacity:0}
#hw-cat.lick .cat-paw{opacity:1;animation:cat-paw-lick .5s ease-in-out infinite alternate}
#hw-cat.lick .cat-mouth{animation:cat-tongue .5s ease-in-out infinite alternate}
#hw-cat.lick .cat-tail{animation:cat-tail-sit 1.4s ease-in-out infinite alternate}
#hw-cat.sit-out .cat-bob{animation:cat-bob-stand .4s ease-in forwards}
#hw-cat.sit-out .leg.l-c,#hw-cat.sit-out .leg.l-d{animation:cat-leg-stand .4s ease-in forwards}
#hw-cat.sit-out .cat-tail{animation:cat-tail-out .4s ease-in forwards}
#hw-cat.meow .cat-bob{transform-origin:60px 36px;animation:cat-bob-meow .45s ease-out forwards}
#hw-cat.meow .cat-mouth{opacity:1;animation:cat-mouth .28s ease-in-out 4 alternate}
@keyframes cat-bob-sit{from{transform:rotate(0)}to{transform:rotate(-22deg)}}
@keyframes cat-bob-lick{from{transform:rotate(-22deg)}to{transform:rotate(-15deg)}}
@keyframes cat-bob-stand{from{transform:rotate(-22deg)}to{transform:rotate(0)}}
@keyframes cat-bob-meow{to{transform:rotate(-9deg)}}
@keyframes cat-leg-sit{to{transform:translateY(-9px) scaleY(1.53)}}
@keyframes cat-leg-stand{from{transform:translateY(-9px) scaleY(1.53)}to{transform:none}}
@keyframes cat-paw-lick{from{transform:translate(74px,37px) rotate(-121deg)}to{transform:translate(74px,37px) rotate(-98deg)}}
@keyframes cat-tail-in{from{transform:none}to{transform:translate(-6px,13px) rotate(-8deg)}}
@keyframes cat-tail-sit{from{transform:translate(-6px,13px) rotate(-8deg)}to{transform:translate(-6px,13px) rotate(10deg)}}
@keyframes cat-tail-out{from{transform:translate(-6px,13px) rotate(-8deg)}to{transform:none}}
@keyframes cat-tongue{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(.8)}}
@keyframes cat-mouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
/* bulle « Miaou ! » (hors du dessin du chat, pour que le texte ne soit pas inversé) */
#hw-cat .cat-say{position:absolute;bottom:100%;right:-6px;margin-bottom:8px;padding:3px 9px;border-radius:12px;background:#FFF3DC;color:#34204D;border:1.5px solid #FFD18A;font:700 13px/1.2 var(--body);white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
#hw-cat .cat-say::after{content:"";position:absolute;top:100%;right:18px;border:5px solid transparent;border-top-color:#FFD18A}
#hw-cat.rtl .cat-say{right:auto;left:-6px}
#hw-cat.rtl .cat-say::after{right:auto;left:18px}
#hw-cat.meow .cat-say{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#hw-cat{display:none!important}}

/* ---------- bruit d'orage (bouton dans le ciel, en haut à droite) ---------- */
.hw-sound{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);right:max(14px,env(safe-area-inset-right,0px));z-index:2;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid #FFD18A;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media(min-width:601px){.hw-sound{right:max(24px,calc((100vw - 1180px)/2 + 18px))}}
.hw-sound:hover{background:rgba(255,255,255,.2)}
.hw-sound[aria-pressed="true"]{background:rgba(242,154,69,.3)}
body:not(.halloween-theme) .hw-sound{display:none}
.hw-sound.hint{animation:hw-sound-hint 2.6s ease-in-out 3}
@keyframes hw-sound-hint{0%,100%{box-shadow:0 0 0 0 rgba(255,209,138,0)}50%{box-shadow:0 0 0 7px rgba(255,209,138,.3)}}
@media(prefers-reduced-motion:reduce){.hw-sound.hint{animation:none}}
</style>

function route(){
  const h = location.hash.replace('#','');
  const [fid0, sid] = h.split('.');
  const [fid, cs, ss] = fid0.split('~');
  const f = FREINS.find(x => x.id === fid);
  const s = f && sid ? f.solutions.find(x => x.id === sid) : null;
  const cc = f && cs && f.cats ? f.cats.find(x => slug(x.nom) === cs) : null;
  const sb = cc && cc.subs && ss ? cc.subs.find(x => slug(x.nom) === ss) : null;
  if (s) renderFiche(f, s);
  else if (sb) renderSubList(f, cc, sb);
  else if (cc && cc.subs) renderSubs(f, cc);
  else if (cc) renderCatList(f, cc);
  else if (f) renderFrein(f);
  else renderHome();
  window.scrollTo(0,0);
}

function setNav(items){
  nav.hidden = !items;
  if (!items) return;
  crumbs.innerHTML = items.map((it,i) => i === items.length-1
    ? `<span class="here" aria-current="page">${esc(it.t)}</span>`
    : `<a href="#${it.h}">${esc(it.t)}</a><span class="sep" aria-hidden="true">›</span>`).join(' ');
}

function wheelSVG(items, hub, label, fs, startDeg){
  const home = !items;
  items = items || FREINS.map(f => ({href:'#'+f.id, nom:f.nom, color:col(f), n:f.solutions.length}));
  hub = hub || ['Freins', "à l'emploi"]; label = label || "Boussole des freins à l'emploi"; fs = fs || 18;
  const n = items.length, R = 250, r0 = 84, cx = 290, cy = 290, mx = n < 6 ? 12 : 14;
  const st = (startDeg === undefined ? -90 : startDeg) * Math.PI/180;
  const pt = (a, rad) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  const wrap=(s,m)=>{const o=[];let c='';s.split(' ').forEach(w=>{if(c&&(c+' '+w).length>m){o.push(c);c=w}else c=c?c+' '+w:w});if(c)o.push(c);return o};

  // lunette de la boussole : anneau marine, graduations tous les 5°, points cardinaux
  let g = `<circle cx="${cx}" cy="${cy}" r="287" fill="#0B2B3D"/>
    <circle cx="${cx}" cy="${cy}" r="286" fill="none" stroke="#B07D1E" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="259" fill="#F5F8F5" stroke="#B07D1E" stroke-width="2.5"/>`;
  let minor = '', major = '';
  for (let d = 0; d < 360; d += 5){
    if (d % 90 === 0) continue;
    const a = (d-90)*Math.PI/180, big = d % 30 === 0;
    const [x1,y1] = pt(a, big ? 262 : 273), [x2,y2] = pt(a, 283);
    const seg = `M${x1.toFixed(1)},${y1.toFixed(1)}L${x2.toFixed(1)},${y2.toFixed(1)}`;
    if (big) major += seg; else minor += seg;
  }
  g += `<path d="${minor}" stroke="rgba(255,255,255,.55)" stroke-width="1.3" fill="none"/>
    <path d="${major}" stroke="#F0CB77" stroke-width="2.4" fill="none"/>`;
  [['N',0],['E',90],['S',180],['O',270]].forEach(([l,d]) => {
    const [x,y] = pt((d-90)*Math.PI/180, 273);
    if (l === 'N') g += `<circle cx="${x}" cy="${y}" r="13" fill="#C23A2B"/>`;
    g += `<text class="bz" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${l}</text>`;
  });

  // secteurs (un par frein)
  items.forEach((f, i) => {
    const a0 = st + i*2*Math.PI/n + 0.012, a1 = st + (i+1)*2*Math.PI/n - 0.012;
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0);
    const d = `M${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
    const am = (a0+a1)/2, [tx,ty] = pt(am, (R+r0)/2 + 6);
    const lines = wrap(f.nom, mx), deg = am*180/Math.PI, rot = n < 6 ? 0 : (Math.cos(am) >= 0 ? deg : deg+180), lh = fs*1.13;
    const tspans = lines.map((l,k) => `<tspan x="${tx}" dy="${k===0 ? -(lines.length-1)*lh/2 : lh}">${esc(l)}</tspan>`).join('');
    g += `<a class="seg" href="${f.href}" tabindex="0" aria-label="${esc(f.nom)} : ${f.n} solutions">
      <path d="${d}" fill="${f.color}" style="transform-origin:${cx}px ${cy}px"/>
      <text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${tspans}</text></a>`;
  });

  // moyeu : aiguille (accueil) ou titre du frein (sous-boussoles)
  g += `<circle class="hub" cx="${cx}" cy="${cy}" r="${r0-8}"/>`;
  if (home) {
    const py = cy-36;
    g += `<g class="needle" aria-hidden="true">
        <polygon points="${cx},${cy-60} ${cx-8},${py} ${cx+8},${py}" fill="#C23A2B"/>
        <polygon points="${cx-8},${py} ${cx+8},${py} ${cx},${cy-12}" fill="#0B2B3D"/>
        <circle cx="${cx}" cy="${py}" r="3.5" fill="#fff" stroke="#0B2B3D" stroke-width="1.5"/></g>
      <text class="hubtxt" x="${cx}" y="${cy+18}" text-anchor="middle" dominant-baseline="middle">${esc(hub[0])}</text>
      <text class="hubtxt" x="${cx}" y="${cy+40}" text-anchor="middle" dominant-baseline="middle">${esc(hub[1])}</text>`;
  } else {
    const L = wrap(hub[0], 13), all = L.concat([hub[1]]), lh = 21, y0 = cy - (all.length-1)*lh/2;
    g += all.map((t,i) => `<text class="hubtxt${i===L.length ? ' hubsub' : ''}" x="${cx}" y="${y0+i*lh}" text-anchor="middle" dominant-baseline="middle">${esc(t)}</text>`).join('');
  }
  return `<svg class="wheel" viewBox="0 0 580 580" role="group" aria-label="${esc(label)}">${g}</svg>`;
}

<script>
/* BOUSSOLE ATOS — événements emploi France Travail
   Après déploiement du Worker Cloudflare, remplacer l'URL ci-dessous par son URL publique.
   Ne jamais placer les identifiants OAuth dans ce fichier HTML. */
(() => {
  const EVENTS_API_URL = "https://atos-evenements-france-travail.direction-atos.workers.dev/";
  const SOURCE_URL = "https://mesevenementsemploi.francetravail.fr/mes-evenements-emploi/";
  let lastEvents = null;
  let lastUpdate = null;
  let loading = false;

  const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));

  const pick = (obj, keys) => {
    for (const key of keys) {
      const value = obj && obj[key];
      if (value !== undefined && value !== null && value !== "") return value;
    }
    return "";
  };

  const toDate = (value) => {
    if (!value) return null;
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  };

  const formatDateParts = (value) => {
    const d = toDate(value);
    if (!d) return {day:"?", month:""};
    return {
      day: new Intl.DateTimeFormat("fr-FR", {day:"2-digit"}).format(d),
      month: new Intl.DateTimeFormat("fr-FR", {month:"short"}).format(d).replace(".", "").toUpperCase()
    };
  };

  const normalizeEvent = (event) => {
    const dateRaw = pick(event, ["dateEvenement", "dateDebut", "dateDebutEvenement", "date"]);
    const date = toDate(dateRaw);
    const title = pick(event, ["titre", "titreEvenement", "intitule", "nom", "libelle"]) || "Événement emploi";
    const city = pick(event, ["ville", "commune", "nomCommune", "localite"]);
    const place = pick(event, ["lieu", "nomLieu", "lieuEvenement", "adresseLieu", "nomSite"]);
    const location = [place, city].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(" · ") || "Haute-Vienne";
    const startTime = pick(event, ["heureDebut", "horaireDebut", "heureDebutEvenement"]);
    const endTime = pick(event, ["heureFin", "horaireFin", "heureFinEvenement"]);
    const url = pick(event, ["urlDetailEvenement", "url", "lien", "urlEvenement"]) || SOURCE_URL;
    return {date, title, location, startTime, endTime, url};
  };

  const getArray = (payload) => {
    if (Array.isArray(payload)) return payload;
    for (const key of ["evenements", "events", "resultats", "results", "items", "content", "data"]) {
      if (Array.isArray(payload?.[key])) return payload[key];
      if (payload?.[key] && typeof payload[key] === "object") {
        for (const nested of ["evenements", "events", "items", "content", "results"]) {
          if (Array.isArray(payload[key][nested])) return payload[key][nested];
        }
      }
    }
    return [];
  };

  const render = () => {
    const containers = document.querySelectorAll("[data-events-list]");
    if (!containers.length) return;
    if (!EVENTS_API_URL || EVENTS_API_URL.includes("A_CONFIGURER")) {
      containers.forEach(el => el.innerHTML =
        '<p class="events-update">Connexion automatique en attente de la configuration sécurisée de France Travail.</p>');
      return;
    }
    if (!lastEvents) {
      containers.forEach(el => el.innerHTML =
        '<p class="events-update">Chargement des événements France Travail…</p>');
      return;
    }
    if (!lastEvents.length) {
      containers.forEach(el => el.innerHTML =
        '<p class="events-update">Aucun événement à venir n’a été retourné pour la Haute-Vienne. Consultez la plateforme officielle.</p>');
      return;
    }

    const cards = lastEvents.slice(0, 3).map(event => {
      const parts = formatDateParts(event.date);
      const formatTime = (value) => {
      const match = String(value ?? "").trim().match(/^(\d{1,2}:\d{2})/);
      return match ? match[1] : String(value ?? "").trim();
    };
    const time = [event.startTime, event.endTime].map(formatTime).filter(Boolean).join(" – ");
      const details = `${time ? "🕘 " + escapeHtml(time) + " · " : ""}📍 ${escapeHtml(event.location)}`;
      const safeUrl = /^https:\/\/mesevenementsemploi\.francetravail\.fr\//i.test(event.url) ? event.url : SOURCE_URL;
      return `<article class="event-card">
        <div class="event-date"><strong>${escapeHtml(parts.day)}</strong><span>${escapeHtml(parts.month)}</span></div>
        <div class="event-info"><h3>${escapeHtml(event.title)}</h3><p>${details}</p>
        <a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">Voir l’événement et s’inscrire ↗</a></div>
      </article>`;
    }).join("");
    containers.forEach(el => el.innerHTML = cards);
    document.querySelectorAll("[data-events-status]").forEach(el => {
      el.textContent = lastUpdate
        ? "Actualisé le " + new Intl.DateTimeFormat("fr-FR", {dateStyle:"short", timeStyle:"short"}).format(lastUpdate) + " · Les informations restent consultables sur France Travail."
        : "Événements récupérés depuis France Travail.";
    });
  };

  const loadEvents = async () => {
    if (loading || !EVENTS_API_URL || EVENTS_API_URL.includes("A_CONFIGURER")) { render(); return; }
    loading = true;
    try {
      const response = await fetch(EVENTS_API_URL, {
        method: "GET",
        headers: {"Accept":"application/json"},
        cache: "no-store"
      });
      if (!response.ok) throw new Error("Réponse API " + response.status);
      const payload = await response.json();
      const today = new Date(); today.setHours(0,0,0,0);
      lastEvents = getArray(payload).map(normalizeEvent)
        .filter(e => e.date && e.date >= today)
        .sort((a,b) => a.date - b.date)
        .slice(0,3);
      lastUpdate = new Date();
      render();
    } catch (error) {
      console.warn("Boussole ATOS : impossible de charger les événements.", error);
      document.querySelectorAll("[data-events-list]").forEach(el => {
        el.innerHTML = '<p class="events-update">Les événements ne sont pas disponibles pour le moment. Réessayez plus tard ou consultez la plateforme France Travail.</p>';
      });
    } finally {
      loading = false;
    }
  };

  const observer = new MutationObserver((records) => {
    const listWasInserted = records.some(record =>
      Array.from(record.addedNodes || []).some(node =>
        node.nodeType === 1 &&
        (node.matches?.("[data-events-list]") || node.querySelector?.("[data-events-list]"))
      )
    );
    if (listWasInserted) render();
  });
  observer.observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener("DOMContentLoaded", loadEvents, {once:true});
  window.addEventListener("pageshow", loadEvents);
  window.addEventListener("online", loadEvents);
  // Actualisation toutes les 6 heures tant que la page reste ouverte.
  window.setInterval(loadEvents, 6 * 60 * 60 * 1000);
})();
</script>

<script>
/* Chat noir : traverse le bas de l'écran quand personne n'a touché à la boussole depuis 20 secondes.
   Pendant la traversée, il s'arrête : une fois pour s'asseoir et se lécher la patte (4 à 5 s, à un endroit
   différent à chaque passage), et de temps en temps ailleurs pour miauler une fois. */
(() => {
  const cat = document.getElementById('hw-cat');
  if (!cat) return;
  const IDLE_MS = 20000, SPEED = 60; /* px par seconde */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let last = Date.now(), walking = false, rtl = true, watcher = null;
  const poke = () => { last = Date.now(); };
  const wait = ms => new Promise(r => window.setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const clearPose = () => cat.classList.remove('stop', 'sit', 'sit-in', 'lick', 'sit-out', 'meow');
  ['pointerdown','pointermove','keydown','scroll','wheel','touchstart','touchmove','click']
    .forEach(ev => window.addEventListener(ev, poke, {passive:true, capture:true}));

  /* s'assoit, se lèche la patte 4 à 5 s, se relève */
  async function lick(anim) {
    anim.pause();
    cat.classList.add('sit', 'sit-in');
    await wait(450);
    cat.classList.replace('sit-in', 'lick');
    await wait(rand(4000, 5000));
    cat.classList.replace('lick', 'sit-out');
    await wait(400);
    clearPose();
    anim.play();
  }

  /* s'arrête, lève la tête, miaule une fois */
  async function meow(anim) {
    anim.pause();
    cat.classList.add('stop');
    await wait(120);
    cat.classList.add('meow');
    await wait(1500);
    cat.classList.remove('meow');
    await wait(250);
    clearPose();
    anim.play();
  }

  /* Choisit où il s'arrête. f = avancée à l'écran dans le sens de la marche (0 = entrée, 1 = sortie) ;
     p = avancée correspondante dans l'animation (qui démarre et finit hors de l'écran). */
  function planStops() {
    const W = window.innerWidth, travel = W + 280, span = Math.max(1, W - 80);
    const toP = f => (rtl ? (W + 140 - (1 - f) * span) : (f * span + 140)) / travel;
    const fl = rand(0.55, 0.85);
    const stops = [{p: toP(fl), run: lick}];
    if (Math.random() < 0.4) {
      let fm = rand(0.12, 0.88), tries = 0;
      while (Math.abs(fm - fl) < 0.2 && tries++ < 10) fm = rand(0.12, 0.88);
      if (Math.abs(fm - fl) >= 0.2) stops.push({p: toP(fm), run: meow});
    }
    return stops.sort((a, b) => a.p - b.p);
  }

  function watch(anim, dur) {
    const stops = planStops();
    let busy = false;
    watcher = window.setInterval(async () => {
      if (busy || !stops.length) return;
      const t = anim.currentTime;
      if (t == null || Number(t) / (dur * 1000) < stops[0].p) return;
      busy = true;
      try { await stops.shift().run(anim); } catch (e) { clearPose(); anim.play(); }
      busy = false;
    }, 100);
  }

  cat.addEventListener('animationend', e => {
    if (e.target !== cat || !String(e.animationName).startsWith('cat-')) return;
    window.clearInterval(watcher); watcher = null;
    clearPose();
    cat.classList.remove('walk','rtl');
    cat.hidden = true;
    walking = false;
    last = Date.now();   /* le prochain passage attend à nouveau 20 s d'inactivité */
  });
  window.setInterval(() => {
    if (walking || document.hidden || reduce.matches) return;
    if (!document.body.classList.contains('halloween-theme')) return;
    if (document.getElementById('brand-splash')) return;
    if (Date.now() - last < IDLE_MS) return;
    walking = true;
    rtl = !rtl;   /* il change de sens à chaque passage */
    const dur = Math.min(40, Math.max(14, (window.innerWidth + 280) / SPEED));
    cat.style.setProperty('--cat-dur', dur.toFixed(1) + 's');
    cat.classList.toggle('rtl', rtl);
    cat.hidden = false;
    void cat.offsetWidth;
    cat.classList.add('walk');
    const anim = cat.getAnimations().find(a => /^cat-(ltr|rtl)$/.test(a.animationName));
    if (anim) watch(anim, dur);
  }, 1000);
})();
</script>
<script>
/* BRUIT D'ORAGE — pluie douce, vent, et tonnerre calé sur chaque éclair du ciel.
   Sons générés par le navigateur (Web Audio) : aucun fichier à héberger.
   Désactivé par défaut : les navigateurs exigent un geste de l'utilisateur pour lancer un son.
   Le choix (son activé) est mémorisé sur l'appareil. */
(() => {
  const btn = document.getElementById('hw-sound');
  if (!btn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { btn.hidden = true; return; }
  const KEY = 'boussole-orage-son';
  const FLASH_AT = 0.87;      /* l'éclair démarre à 87 % de son cycle CSS (@keyframes storm-strike) */
  const MASTER_LEVEL = 0.6;   /* volume général (doux) */
  let ctx = null, master = null, bufs = null, enabled = false, waiting = false, timers = [];
  const rand = (a, b) => a + Math.random() * (b - a);

  function makeBuffers() {
    const sr = ctx.sampleRate;
    const white = ctx.createBuffer(1, sr * 3, sr), w = white.getChannelData(0);
    for (let i = 0; i < w.length; i++) w[i] = Math.random() * 2 - 1;
    const brown = ctx.createBuffer(1, sr * 4, sr), b = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < b.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }
    bufs = { white, brown };
  }

  function startAmbient() {
    /* pluie : bruit blanc filtré, légère houle lente */
    const rain = ctx.createBufferSource(); rain.buffer = bufs.white; rain.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    const rg = ctx.createGain(); rg.gain.value = 0.04;
    rain.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(master);
    const l1 = ctx.createOscillator(); l1.frequency.value = 0.11;
    const l1g = ctx.createGain(); l1g.gain.value = 0.012;
    l1.connect(l1g); l1g.connect(rg.gain);
    /* vent : bruit brun, filtre qui respire */
    const wind = ctx.createBufferSource(); wind.buffer = bufs.brown; wind.loop = true;
    const wlp = ctx.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 420;
    const wg = ctx.createGain(); wg.gain.value = 0.12;
    wind.connect(wlp); wlp.connect(wg); wg.connect(master);
    const l2 = ctx.createOscillator(); l2.frequency.value = 0.07;
    const l2g = ctx.createGain(); l2g.gain.value = 0.05;
    l2.connect(l2g); l2g.connect(wg.gain);
    const l3 = ctx.createOscillator(); l3.frequency.value = 0.05;
    const l3g = ctx.createGain(); l3g.gain.value = 140;
    l3.connect(l3g); l3g.connect(wlp.frequency);
    [rain, l1, wind, l2, l3].forEach(n => n.start());
  }

  /* craquement sec de l'éclair : petites rafales de bruit filtré */
  function crack(t, level) {
    const src = ctx.createBufferSource(); src.buffer = bufs.white;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1400, 2600); bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(master);
    const n = Math.floor(rand(5, 9)); let x = t;
    for (let i = 0; i < n; i++) {
      const dec = rand(0.02, 0.045), a = level * rand(0.4, 1) * (1 - i / (n + 1));
      g.gain.setValueAtTime(0.0001, x);
      g.gain.linearRampToValueAtTime(a, x + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0008, x + 0.004 + dec);
      x += 0.004 + dec + rand(0.01, 0.03);
    }
    src.start(t, rand(0, 1.5)); src.stop(x + 0.1);
  }

  /* grondement : bruit brun grave, qui s'éteint par vagues */
  function rumble(t, dur, level) {
    const src = ctx.createBufferSource(); src.buffer = bufs.brown; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(380, t); lp.frequency.exponentialRampToValueAtTime(70, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(level, t + 0.35);
    let x = t + 0.35;
    while (x < t + dur - 1.2) {
      const nx = Math.min(x + rand(0.5, 1.1), t + dur - 0.6);
      g.gain.linearRampToValueAtTime(level * rand(0.45, 1) * (1 - (x - t) / dur), nx);
      x = nx;
    }
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t, rand(0, 2)); src.stop(t + dur + 0.1);
  }

  function thunder(cycleMs) {
    const t = ctx.currentTime + 0.02;
    const gap = Math.min(0.9, Math.max(0.3, cycleMs * 0.03 / 1000)); /* même écart que le double éclat visuel */
    crack(t, 0.3);
    crack(t + gap, 0.18);
    rumble(t + 0.12, rand(3.6, 5.2), 0.55);
  }

  /* Synchronisation : on lit l'horloge de l'animation CSS de chaque éclair et on programme le tonnerre au même instant. */
  function sched(el) {
    if (!enabled) return;
    const a = el.getAnimations().find(x => x.animationName === 'storm-strike');
    if (!a || a.currentTime == null) return;   /* pas d'éclair affiché (ex. animations réduites) : pas de tonnerre */
    const tm = a.effect.getComputedTiming(), dur = tm.duration, at = dur * FLASH_AT;
    const t = Number(a.currentTime) - tm.delay;
    let wait = t < 0 ? at - t : (at - (t % dur) + dur) % dur;
    if (wait < 80) wait += dur;
    timers.push(window.setTimeout(() => {
      if (!enabled) return;
      if (!document.body.classList.contains('halloween-theme')) { setState(false); return; }
      if (!document.hidden && ctx.state === 'running') thunder(dur);
      sched(el);
    }, wait));
  }

  /* waiting : le son est voulu mais le navigateur attend un premier geste de la personne pour l'autoriser */
  function ui() {
    const live = enabled && !waiting;
    btn.setAttribute('aria-pressed', String(live));
    const label = waiting ? "Lancer le bruit d'orage" : (enabled ? "Couper le bruit d'orage" : "Activer le bruit d'orage");
    btn.setAttribute('aria-label', label); btn.title = label;
    btn.textContent = live ? '🔊' : '🔇';
  }

  async function setState(on, remember = true) {
    enabled = on;
    waiting = false;
    if (remember) { try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {} }
    ui();
    timers.forEach(clearTimeout); timers = [];
    if (on) {
      btn.classList.remove('hint');
      if (!ctx) {
        ctx = new AC(); makeBuffers();
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 6;
        master = ctx.createGain(); master.gain.value = 0;
        master.connect(comp); comp.connect(ctx.destination);
        startAmbient();
      }
      try { await ctx.resume(); } catch (e) {}
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(MASTER_LEVEL, ctx.currentTime, 0.6);   /* fondu d'entrée */
      document.querySelectorAll('.storm-flash').forEach(sched);
    } else if (ctx) {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.25);              /* fondu de sortie */
      window.setTimeout(() => { if (!enabled && ctx) ctx.suspend(); }, 1300);
    }
  }

  btn.addEventListener('click', () => setState(waiting ? true : !enabled));

  /* pas de bruit quand l'onglet est caché */
  document.addEventListener('visibilitychange', () => {
    if (!ctx || !enabled) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  /* son déjà activé lors d'une visite précédente : il démarre tout seul si le navigateur l'autorise,
     sinon au premier geste (règle des navigateurs), et le bouton l'indique en attendant */
  const canAutoplay = () => new Promise(res => {
    let t;
    try { t = new AC(); } catch (e) { res(false); return; }
    const done = ok => { try { t.close(); } catch (e) {} res(ok); };
    if (t.state === 'running') { done(true); return; }
    t.addEventListener('statechange', () => { if (t.state === 'running') done(true); });
    window.setTimeout(() => done(false), 400);
  });
  let wanted = false;
  try { wanted = localStorage.getItem(KEY) === 'on'; } catch (e) {}
  if (wanted) {
    enabled = true; waiting = true; ui(); btn.classList.add('hint');
    const evs = ['pointerdown', 'keydown', 'touchend', 'click'];
    const disarm = () => evs.forEach(ev => window.removeEventListener(ev, arm, true));
    const arm = (e) => {
      if (waiting && e && e.target && btn.contains(e.target)) return;   /* le bouton gère lui-même son clic */
      disarm();
      if (enabled && waiting) setState(true, false);
    };
    evs.forEach(ev => window.addEventListener(ev, arm, true));
    canAutoplay().then(ok => { if (ok && enabled && waiting) { disarm(); setState(true, false); } });
  }
})();
</script>
</body></html>
