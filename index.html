img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;color:var(--marine);text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(18px,env(safe-area-inset-right,0px)) 56px max(18px,env(safe-area-inset-left,0px))}

/* ---------- bandeau d'application ---------- */
.app-topbar{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(115deg,var(--marine),var(--marine-2));color:#fff;border-bottom:3px solid var(--laiton)}
@media(min-width:601px){.app-topbar{padding-left:max(24px,calc((100vw - 1180px)/2 + 18px));padding-right:max(24px,calc((100vw - 1180px)/2 + 18px))}}
.app-logo{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:23px;background:rgba(255,255,255,.08);border:2px solid var(--laiton-clair)}
.app-brand{min-width:0;flex:1}
.app-brand strong{display:block;font:700 19px/1.15 var(--display);color:#fff}
.app-brand span{display:block;margin-top:3px;font-size:12.5px;letter-spacing:.03em;color:#C4D7DF;text-wrap:balance}
.app-top-pill{white-space:nowrap;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--laiton-clair);border:1px solid rgba(240,203,119,.6)}

/* ---------- navigation (fil d'Ariane) ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(245,248,245,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;font:700 16px/1 var(--body);color:var(--marine);background:var(--surface);border:1.5px solid var(--marine);border-radius:999px;cursor:pointer}
.btn:hover{background:#E3EEF1}
.btn.primary{background:var(--marine);color:#fff}
.btn.primary:hover{background:var(--marine-2)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;font-size:15px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:700}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs .sep{color:var(--laiton);font-weight:700}
.crumbs .here{color:var(--ink);font-weight:700}
.navbtns{margin-left:auto;display:flex;gap:8px}

/* ---------- accueil : la boussole ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,3.5vw,44px);align-items:start}
.eyebrow{font-size:15px;font-weight:700;color:var(--muted)}
.intro p{color:var(--muted);max-width:56ch}
.wheel-stage{position:relative;padding:clamp(10px,2vw,22px);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:
    linear-gradient(rgba(11,43,61,.05) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(11,43,61,.05) 1px,transparent 1px) 0 0/32px 32px,
    radial-gradient(circle at 50% 45%,#fff 0,#EFF5F1 78%)}
@media(min-width:821px){.wheel-stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}}
.wheel-cap{margin:6px 8px 2px;text-align:center;font-size:15px;color:var(--muted)}
.wheel{display:block;width:100%;max-width:580px;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(11,43,61,.2))}
.wheel a{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wheel .seg{outline:none}
.wheel .seg path{transition:transform .22s ease,filter .22s}
@media(hover:hover){.wheel .seg:hover path{transform:scale(1.03);filter:brightness(1.1)}}
.wheel .seg:focus-visible path{stroke:#fff;stroke-width:5;transform:scale(1.03)}
.wheel text{font-family:var(--body);font-weight:700;fill:#fff;pointer-events:none;letter-spacing:.01em}
.wheel .seg text{stroke:rgba(0,0,0,.16);stroke-width:2px;paint-order:stroke;stroke-linejoin:round}
.wheel .hub{fill:#fff;stroke:var(--laiton);stroke-width:4}
.wheel .hubtxt{fill:var(--marine);font-family:var(--display);font-size:18px;font-weight:700}
.wheel .hubsub{fill:var(--muted);font-family:var(--body);font-size:15px}
.wheel .bz{fill:#fff;font-family:var(--display);font-size:18px}
.wheel .needle{transform-box:fill-box;transform-origin:50% 50%;animation:settle 2.2s cubic-bezier(.22,.8,.3,1) .2s both}
@keyframes settle{0%{transform:rotate(-65deg)}30%{transform:rotate(22deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}

.intro-copy{padding:clamp(22px,3.2vw,38px);border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#FAEFCF;color:var(--warn-ink);font-weight:700;font-size:14px}
.intro-kicker .spark{color:var(--laiton);font-size:16px}
.intro h1{margin:14px 0 12px;font-size:clamp(34px,4.6vw,52px);letter-spacing:-.015em;font-variation-settings:"opsz" 120}
.intro-lead{font-size:clamp(17px,1.6vw,19px);line-height:1.55}

/* recherche */
.search-panel{margin-top:22px;padding:18px;border-radius:20px;background:var(--papier);border:1px solid var(--line)}
.search-title{display:flex;align-items:center;gap:9px;margin-bottom:10px;font:700 18px/1.3 var(--display);color:var(--marine)}
.search-field{display:flex;align-items:center;gap:10px;padding:0 14px;border:2px solid var(--marine);border-radius:14px;background:#fff}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,92,116,.2)}
.search-field span{font-size:20px;color:var(--marine)}
.search-field input{width:100%;min-width:0;padding:14px 0;border:0;outline:0;background:transparent;color:var(--ink);font:17px var(--body)}
.search-field input::placeholder{color:#5B6E76}
.search-hint{margin:8px 2px 0;font-size:14px;color:var(--muted)}
.search-results{display:grid;gap:8px;margin-top:12px}
.search-result{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}
.search-result:hover{border-color:var(--accent)}
.search-result .result-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;background:var(--papier);font-size:23px}
.search-result .result-copy{min-width:0;flex:1}
.search-result strong{display:block;line-height:1.3;font-size:16.5px}
.search-result small{display:block;margin-top:3px;font-size:14px;color:var(--muted)}
.search-result .arrow{font-size:20px;color:var(--f6)}
.search-empty{padding:14px;border-radius:12px;background:#fff;border:1px dashed var(--line);font-size:15px;color:var(--muted)}

/* liste des freins (alternative lisible à la boussole) */
.legend{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.legend a{display:flex;align-items:center;gap:11px;min-height:64px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-left:6px solid var(--icon-color,var(--accent));border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:16.5px;line-height:1.25}
.legend a:active{background:var(--papier)}
@media(hover:hover){.legend a:hover{background:var(--papier);box-shadow:var(--shadow)}}
.legend .visual-mark{width:42px;height:42px;border-radius:12px;font-size:23px}
.legend .n{margin-left:auto;flex:none;display:inline-flex;gap:.3em;white-space:nowrap;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--papier);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.legend .n .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.25)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 16px;border-radius:12px;border-left:5px solid var(--laiton);background:var(--warn-bg);color:var(--warn-ink);font-size:15px}

/* ---------- pages « frein » et listes ---------- */
.head{display:flex;gap:18px;align-items:center;margin:8px 0 24px;padding:20px 22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.badge{width:72px;height:72px;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-size:32px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3),0 4px 12px rgba(11,43,61,.2)}
.head h1{font-size:clamp(30px,4vw,44px)}
.head p{margin:6px 0 0;max-width:62ch;color:var(--muted)}
.tag{display:inline-block;margin-bottom:2px;font-size:14px;font-weight:700;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:190px;padding:20px 20px 18px 22px;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:20px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:box-shadow .18s,transform .18s}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(11,43,61,.14)}}
.card:active{background:var(--papier)}
.card-top{display:flex;align-items:center;gap:12px}
.card h2{font-size:21px;font-weight:600}
.card p{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.card .go{display:flex;align-items:center;gap:7px;margin-top:auto;font-weight:700;font-size:16px;color:var(--accent)}
.card .go span{transition:transform .18s}
.card:hover .go span{transform:translateX(3px)}
.visual-mark{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:13px;font-size:24px;line-height:1;background:color-mix(in srgb,var(--c,var(--accent)) 14%,#fff)}
.card .visual-mark{width:48px;height:48px}
.cat{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px;padding-bottom:8px;border-bottom:3px solid var(--c);font-size:23px}
.cat .n{font-size:14px;font-weight:700;color:var(--muted)}

/* ---------- fiche ---------- */
.fh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 20px}
.fh h1{width:100%;display:flex;align-items:center;gap:12px;font-size:clamp(28px,4vw,42px)}
.pill{padding:4px 11px;border-radius:999px;background:var(--c);color:#fff;font-size:14px;font-weight:700}
.fiche{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.panel h2{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:21px}
.panel section+section{margin-top:24px;padding-top:22px;border-top:2px dashed #BCCBC4}
.panel p{margin:0;max-width:68ch}
.panel ul{margin:8px 0 0;padding-left:22px}
.panel li{margin:5px 0}
.panel li::marker{color:var(--c,var(--accent))}
.section-icon{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;font-size:18px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,#fff)}
.contact{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;border-color:var(--marine);border-top:6px solid var(--c);background:linear-gradient(160deg,var(--marine),var(--marine-2));color:#EAF2F5}
.contact h2{color:#fff}
.contact h2:before{content:"📍";font-size:20px}
.contact dl{margin:0;display:grid;gap:14px}
.contact dt{font-size:14px;font-weight:700;color:#A9C6D3}
.contact dd{margin:2px 0 0;overflow-wrap:anywhere}
.contact a{color:var(--laiton-clair)}
.todo{padding:2px 9px;border-radius:7px;background:var(--warn-bg);color:var(--warn-ink);font-size:15px;font-style:italic}
.view{animation:in .2s ease}
@keyframes in{from{opacity:.3}to{opacity:1}}

/* ---------- tablette ---------- */
@media(max-width:820px){
  .intro{grid-template-columns:1fr}
  .wheel-stage{position:static;width:100%;max-width:600px;margin:0 auto}
  .fiche{grid-template-columns:1fr}
  .contact{position:static}
}

/* ---------- mobile : lisibilité d'abord ---------- */
@media(max-width:600px){
  .app-topbar{padding-left:16px;padding-right:16px;gap:12px}
  .app-logo{width:40px;height:40px;font-size:21px}
  .app-brand strong{font-size:17px}
  .app-brand span{font-size:12px}
  .app-top-pill{font-size:11px;padding:5px 8px}
  .wrap{padding:16px 14px 32px}
  .intro{display:flex;flex-direction:column;align-items:stretch;gap:16px}
  /* la boussole occupe toute la largeur de l'écran : libellés plus grands */
  .wheel-stage{max-width:none;margin:0 -14px;width:auto;padding:10px 0 8px;border-radius:0;border-left:0;border-right:0}
  .wheel{max-width:none}
  .intro-copy{padding:20px 16px;border-radius:22px}
  .intro h1{font-size:34px}
  .search-panel{padding:14px 12px}
  .search-field{padding:0 12px}
  .search-field input{font-size:16px}
  .legend{grid-template-columns:minmax(0,1fr)}
  .legend .n .lab{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .note{font-size:14.5px}
  .head{gap:14px;padding:16px;margin-bottom:18px;border-radius:20px}
  .badge{width:56px;height:56px;font-size:26px}
  .head h1{font-size:30px}
  .head p{font-size:16px}
  .cards{grid-template-columns:1fr;gap:12px}
  .card{min-height:0;padding:16px 16px 16px 18px;border-radius:18px}
  .card h2{font-size:20px}
  .fh h1{font-size:29px}
  .fiche{gap:14px}
  .panel{padding:18px 16px;border-radius:20px}
  .panel section+section{margin-top:18px;padding-top:16px}
  .nav .wrap{padding:8px 14px;gap:6px}
  .crumbs{flex:1 1 100%;font-size:14px}
  .navbtns{width:100%;margin-left:0}
  .navbtns .btn{flex:1;min-height:46px;font-size:16px;border-radius:14px}
}
@media(prefers-reduced-motion:reduce){
  .view,.wheel .needle{animation:none}
  .wheel .seg path,.card,.card .go span{transition:none}
}

      contact:{structure:"PLIMOT 87 (Delta Plus)", adresse:"95 rue de Fougeras, 87280 Limoges", tel:"05 55 35 90 14", mail:"plimot@deltaplus87.fr", horaires:"", site:"https://www.fondation-amisdelatelier.org/"} }
   ]}
];

/* ===================== Application ===================== */
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todo = '<span class="todo">À compléter</span>';
const val = v => v ? esc(v) : todo;
const col = f => `var(${f.couleur})`;
const cnt = n => `<span class="n">${n}<span class="lab">fiche${n>1?'s':''}</span></span>`;
const go = h => { location.hash = h; };

function route(){
  const h = location.hash.replace('#','');
  const [fid0, sid] = h.split('.');
  const [fid, cs] = fid0.split('~');
  const f = FREINS.find(x => x.id === fid);
  const s = f && sid ? f.solutions.find(x => x.id === sid) : null;
  const cc = f && cs && f.cats ? f.cats.find(x => slug(x.nom) === cs) : null;
  if (s) renderFiche(f, s);
  else if (cc) renderCatList(f, cc);
  else if (f) renderFrein(f);
  else renderHome();
  window.scrollTo(0,0);
}

function setNav(items){
  nav.hidden = !items;
  if (!items) return;
  crumbs.innerHTML = items.map((it,i) => i === items.length-1
    ? `<span class="here" aria-current="page">${esc(it.t)}</span>`
    : `<a href="#${it.h}">${esc(it.t)}</a><span class="sep" aria-hidden="true">›</span>`).join(' ');
}

function wheelSVG(items, hub, label, fs, startDeg){
  const home = !items;
  items = items || FREINS.map(f => ({href:'#'+f.id, nom:f.nom, color:col(f), n:f.solutions.length}));
  hub = hub || ['Freins', "à l'emploi"]; label = label || "Boussole des freins à l'emploi"; fs = fs || 18;
  const n = items.length, R = 250, r0 = 84, cx = 290, cy = 290, mx = n < 6 ? 12 : 14;
  const st = (startDeg === undefined ? -90 : startDeg) * Math.PI/180;
  const pt = (a, rad) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  const wrap=(s,m)=>{const o=[];let c='';s.split(' ').forEach(w=>{if(c&&(c+' '+w).length>m){o.push(c);c=w}else c=c?c+' '+w:w});if(c)o.push(c);return o};

  // lunette de la boussole : anneau marine, graduations tous les 5°, points cardinaux
  let g = `<circle cx="${cx}" cy="${cy}" r="287" fill="#0B2B3D"/>
    <circle cx="${cx}" cy="${cy}" r="286" fill="none" stroke="#B07D1E" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="259" fill="#F5F8F5" stroke="#B07D1E" stroke-width="2.5"/>`;
  let minor = '', major = '';
  for (let d = 0; d < 360; d += 5){
    if (d % 90 === 0) continue;
    const a = (d-90)*Math.PI/180, big = d % 30 === 0;
    const [x1,y1] = pt(a, big ? 262 : 273), [x2,y2] = pt(a, 283);
    const seg = `M${x1.toFixed(1)},${y1.toFixed(1)}L${x2.toFixed(1)},${y2.toFixed(1)}`;
    if (big) major += seg; else minor += seg;
  }
  g += `<path d="${minor}" stroke="rgba(255,255,255,.55)" stroke-width="1.3" fill="none"/>
    <path d="${major}" stroke="#F0CB77" stroke-width="2.4" fill="none"/>`;
  [['N',0],['E',90],['S',180],['O',270]].forEach(([l,d]) => {
    const [x,y] = pt((d-90)*Math.PI/180, 273);
    if (l === 'N') g += `<circle cx="${x}" cy="${y}" r="13" fill="#C23A2B"/>`;
    g += `<text class="bz" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${l}</text>`;
  });

  // secteurs (un par frein)
  items.forEach((f, i) => {
    const a0 = st + i*2*Math.PI/n + 0.012, a1 = st + (i+1)*2*Math.PI/n - 0.012;
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0);
    const d = `M${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
    const am = (a0+a1)/2, [tx,ty] = pt(am, (R+r0)/2 + 6);
    const lines = wrap(f.nom, mx), deg = am*180/Math.PI, rot = n < 6 ? 0 : (Math.cos(am) >= 0 ? deg : deg+180), lh = fs*1.13;
    const tspans = lines.map((l,k) => `<tspan x="${tx}" dy="${k===0 ? -(lines.length-1)*lh/2 : lh}">${esc(l)}</tspan>`).join('');
    g += `<a class="seg" href="${f.href}" tabindex="0" aria-label="${esc(f.nom)} : ${f.n} solutions">
      <path d="${d}" fill="${f.color}" style="transform-origin:${cx}px ${cy}px"/>
      <text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${tspans}</text></a>`;
  });

  // moyeu : aiguille (accueil) ou titre du frein (sous-boussoles)
  g += `<circle class="hub" cx="${cx}" cy="${cy}" r="${r0-8}"/>`;
  if (home) {
    const py = cy-36;
    g += `<g class="needle" aria-hidden="true">
        <polygon points="${cx},${cy-60} ${cx-8},${py} ${cx+8},${py}" fill="#C23A2B"/>
        <polygon points="${cx-8},${py} ${cx+8},${py} ${cx},${cy-12}" fill="#0B2B3D"/>
        <circle cx="${cx}" cy="${py}" r="3.5" fill="#fff" stroke="#0B2B3D" stroke-width="1.5"/></g>
      <text class="hubtxt" x="${cx}" y="${cy+18}" text-anchor="middle" dominant-baseline="middle">${esc(hub[0])}</text>
      <text class="hubtxt" x="${cx}" y="${cy+40}" text-anchor="middle" dominant-baseline="middle">${esc(hub[1])}</text>`;
  } else {
    const L = wrap(hub[0], 13), all = L.concat([hub[1]]), lh = 21, y0 = cy - (all.length-1)*lh/2;
    g += all.map((t,i) => `<text class="hubtxt${i===L.length ? ' hubsub' : ''}" x="${cx}" y="${y0+i*lh}" text-anchor="middle" dominant-baseline="middle">${esc(t)}</text>`).join('');
  }
  return `<svg class="wheel" viewBox="0 0 580 580" role="group" aria-label="${esc(label)}">${g}</svg>`;
}

const ICONS = {
  mobilite:"🚲", langue:"💬", logement:"🏠", finances:"💶", sante:"🩺",
  handicap:"♿", garde:"🧸", numerique:"💻", administratif:"🗂️",
  prescripteurs:"🤝", emploi:"💼"
};
const iconFor = id => ICONS[id] || "✨";
const mark = (id, color) => `<span class="visual-mark" style="--c:${color||'var(--accent)'}" aria-hidden="true">${iconFor(id)}</span>`;
const SECTION_ICONS = {"Présentation du dispositif":"📖","Ce qui est proposé":"🧰","Conditions d'éligibilité":"✅","Comment y accéder":"🧭"};
function renderHome(){
  setNav(null);
  document.title = "Boussole des freins à l'emploi · Haute-Vienne";
  const totalSolutions = FREINS.reduce((n,f)=>n+f.solutions.length,0);
  app.innerHTML = `<div class="view intro">
    <div class="wheel-stage">${wheelSVG()}<p class="wheel-cap">Touchez un secteur de la boussole pour explorer les solutions.</p></div>
    <div class="intro-copy">
      <div class="intro-kicker"><span class="spark">✦</span> Outil d’orientation · Haute-Vienne</div>
      <h1>Un frein à l’emploi ?<br>Des solutions existent.</h1>
      <p class="intro-lead">Repérez la difficulté rencontrée et explorez les dispositifs, accompagnements et contacts utiles pour construire la prochaine étape du parcours.</p>
      <div class="search-panel">
        <div class="search-title"><span aria-hidden="true">🔎</span> Trouver une solution rapidement</div>
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="solution-search" type="search" placeholder="Ex. permis, logement, garde d’enfant…" autocomplete="off" aria-label="Rechercher un frein ou une solution"></label>
        <p class="search-hint">Recherchez par nom de dispositif, besoin ou mot-clé.</p>
        <div class="search-results" id="search-results" aria-live="polite"></div>
      </div>
      <ul class="legend">${FREINS.map(f => `<li><a href="#${f.id}" style="--icon-color:${col(f)}">${mark(f.id,col(f))}<span>${esc(f.nom)}</span>${cnt(f.solutions.length)}</a></li>`).join('')}</ul>
      <div class="note">ℹ️ Les mentions « à vérifier » signalent des coordonnées à confirmer ; les champs « À compléter » restent à renseigner avant diffusion.</div>
    </div></div>`;
  const input = document.getElementById('solution-search');
  const results = document.getElementById('search-results');
  const searchable = FREINS.flatMap(f => f.solutions.map(s => ({f,s,hay:[f.nom,s.nom,s.type,s.resume,s.presentation,(s.propose||[]).join(' '),(s.eligibilite||[]).join(' ')].join(' ').toLocaleLowerCase('fr')})));
  function updateSearch(){
    const q = input.value.trim().toLocaleLowerCase('fr');
    if(!q){results.innerHTML='';return;}
    const matches = searchable.filter(x=>x.hay.includes(q)).slice(0,7);
    results.innerHTML = matches.length ? matches.map(({f,s})=>`<a class="search-result" href="#${f.id}.${s.id}"><span class="result-icon">${iconFor(f.id)}</span><span class="result-copy"><strong>${esc(s.nom)}</strong><small>${esc(f.nom)} · ${esc(s.type)}</small></span><span class="arrow" aria-hidden="true">→</span></a>`).join('') : `<div class="search-empty">Aucun résultat exact. Essayez un autre mot ou choisissez un frein dans la liste.</div>`;
  }
  input.addEventListener('input',updateSearch);
}

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cardHTML = (f, s, c) => `<a class="card" style="--c:${c}" href="#${f.id}.${s.id}">
  <div class="card-top">${mark(f.id,c)}<div><span class="tag">${esc(s.type)}</span><h2>${esc(s.nom)}</h2></div></div>
  <p>${esc(s.resume)}</p><span class="go">Découvrir la solution <span aria-hidden="true">→</span></span></a>`;

function renderFrein(f){
  if (f.cats) return renderCats(f);
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}]);
  app.innerHTML = `<div class="view">
    <div class="head"><div class="badge" style="background:${col(f)}">${iconFor(f.id)}</div>
      <div><span class="tag">Frein périphérique</span><h1>${esc(f.nom)}</h1><p>${esc(f.intro)}</p></div></div>
    <div class="cards">${f.solutions.map(s => cardHTML(f, s, col(f))).join('')}</div></div>`;
}

function renderCats(f){
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}]);
  const items = f.cats.map(c => ({href:'#'+f.id+'~'+slug(c.nom), nom:c.nom, color:`var(${c.couleur})`, n:f.solutions.filter(s => s.cat === c.nom).length}));
  app.innerHTML = `<div class="view intro">
    <div class="wheel-stage">${wheelSVG(items, [f.nom, f.cats.length+' catégories'], f.nom+' : catégories', 20, 150)}</div>
    <div>
      <div class="eyebrow">Frein périphérique</div>
      <h1>${esc(f.nom)}</h1>
      <p>${esc(f.intro)}</p>
      <ul class="legend">${items.map(it => `<li><a href="${it.href}" style="--icon-color:${it.color}"><span class="dot" style="background:${it.color}"></span>${esc(it.nom)}${cnt(it.n)}</a></li>`).join('')}</ul>
    </div></div>`;
}

function renderCatList(f, c){
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id},{t:c.nom,h:f.id+'~'+slug(c.nom)}]);
  const k = `var(${c.couleur})`, list = f.solutions.filter(s => s.cat === c.nom);
  app.innerHTML = `<div class="view">
    <div class="head"><div class="badge" style="background:${k}">${iconFor(f.id)}</div>
      <div><span class="tag">${esc(f.nom)} · ${list.length} fiches</span><h1>${esc(c.nom)}</h1><p>${esc(c.desc)}</p></div></div>
    <div class="cards">${list.map(s => cardHTML(f, s, k)).join('')}</div></div>`;
}

function list(arr){ return arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${todo}</p>`; }

function renderFiche(f, s){
  const cc = (f.cats||[]).find(x => x.nom === s.cat);
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}].concat(cc ? [{t:cc.nom,h:f.id+'~'+slug(cc.nom)}] : [], [{t:s.nom,h:`${f.id}.${s.id}`}]));
  const c = s.contact || {};
  const site = c.site ? `<a href="${esc(c.site)}" target="_blank" rel="noopener">${esc(c.site.replace(/^https?:\/\//,''))}</a>` : todo;
  app.innerHTML = `<div class="view" style="--c:${cc ? `var(${cc.couleur})` : col(f)}">
    <div class="fh"><span class="pill">${esc(cc ? f.nom+' · '+cc.nom : f.nom)}</span><span class="tag">${esc(s.type)}</span><h1>${mark(f.id,cc ? `var(${cc.couleur})` : col(f))}${esc(s.nom)}</h1></div>
    <div class="fiche">
      <article class="panel">
        <section><h2><span class="section-icon" aria-hidden="true">📖</span>Présentation du dispositif</h2><p>${val(s.presentation)}</p></section>
        <section><h2><span class="section-icon" aria-hidden="true">🧰</span>Ce qui est proposé</h2>${list(s.propose)}</section>
        <section><h2><span class="section-icon" aria-hidden="true">✅</span>Conditions d'éligibilité</h2>${list(s.eligibilite)}</section>
        <section><h2><span class="section-icon" aria-hidden="true">🧭</span>Comment y accéder</h2><p>${val(s.acces)}</p></section>
      </article>
      <aside class="panel contact">
        <h2>Contacts</h2>
        <dl>
          <div><dt>Structure</dt><dd>${val(c.structure)}</dd></div>
          <div><dt>Adresse</dt><dd>${val(c.adresse)}</dd></div>
          <div><dt>Téléphone</dt><dd>${val(c.tel)}</dd></div>
          <div><dt>Courriel</dt><dd>${val(c.mail)}</dd></div>
          <div><dt>Horaires</dt><dd>${val(c.horaires)}</dd></div>
          <div><dt>Site internet</dt><dd>${site}</dd></div>
        </dl>
      </aside>
    </div></div>`;
}

const tabSearch = document.getElementById('tab-search');
function setMobileTab(which){
  if (tabSearch) tabSearch.classList.toggle('active', which === 'search');
  const tabHome = document.getElementById('tab-home');
  if (tabHome) tabHome.classList.toggle('active', which === 'home');
}
if (tabSearch) {
  tabSearch.addEventListener('click', () => {
    if(location.hash) go('');
    setMobileTab('search');
    window.setTimeout(() => {
      const field = document.getElementById('solution-search');
      if(field){ field.scrollIntoView({behavior:'smooth',block:'center'}); field.focus({preventScroll:true}); }
    }, 80);
  });
}
const topHome = document.getElementById('home');
if (topHome) topHome.addEventListener('click', () => { go(''); setMobileTab('home'); });
const bottomHome = document.getElementById('tab-home');
if (bottomHome) bottomHome.addEventListener('click', () => { go(''); setMobileTab('home'); });
document.getElementById('back').addEventListener('click', () => {
  const [fid, sid] = location.hash.replace('#','').split('.');
  go(sid ? fid : '');
});
window.addEventListener('hashchange', () => { route(); setMobileTab(location.hash ? 'home' : 'home'); });
route();
</script>
