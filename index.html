<style>
/* Layout : une roue d'orientation au centre, puis deux niveaux de pages (solutions, fiche) avec fil d'Ariane fixe en haut */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#16242E; --muted:#56656F; --line:#D3DCE1;
  --accent:#0E5E6F; --accent-ink:#FFFFFF; --warn-bg:#FFF2D6; --warn-ink:#6B4A00;
  --f1:#1F7A8C; --f2:#7A4FB0; --f3:#C2552D; --f4:#2E8B57; --f5:#C23B5E; --f6:#B8860B; --f7:#3A5BA0; --f8:#5F6B3A; --f9:#4F6D7A; --f10:#8A4B6B; --f11:#8C2F39;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#18232A; --ink:#E6EEF2; --muted:#9AAAB4; --line:#2A3943;
  --accent:#5CC2D4; --accent-ink:#0F171C; --warn-bg:#3A2F14; --warn-ink:#F2D58C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#18232A; --ink:#E6EEF2; --muted:#9AAAB4; --line:#2A3943;
  --accent:#5CC2D4; --accent-ink:#0F171C; --warn-bg:#3A2F14; --warn-ink:#F2D58C; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

/* barre de navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--body);padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;color:var(--muted);min-width:0}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs .sep{opacity:.6}
.crumbs .here{color:var(--ink);font-weight:700}
.navbtns{margin-left:auto;display:flex;gap:8px}

/* accueil */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;margin-top:12px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.intro h1{font-size:clamp(32px,5vw,52px);font-weight:800;margin-top:6px}
.intro p{color:var(--muted);max-width:52ch}
.wheel{width:100%;max-width:560px;margin:0 auto;display:block}
.wheel a{cursor:pointer}
.wheel .seg path{transition:transform .25s ease, filter .25s}
.wheel .seg:hover path,.wheel .seg:focus path{transform:scale(1.04);filter:brightness(1.08)}
.wheel .seg{outline:none}
.wheel .seg:focus-visible path{stroke:var(--ink);stroke-width:4}
.wheel text{font-family:var(--display);font-weight:700;fill:#fff;pointer-events:none}
.wheel .hub{fill:var(--surface);stroke:var(--line);stroke-width:2}
.wheel .hubtxt{fill:var(--ink)}
.legend{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.legend a:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.legend .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px;font-variant-numeric:tabular-nums}
.note{margin-top:22px;background:var(--warn-bg);color:var(--warn-ink);padding:12px 16px;border-radius:10px;font-size:15px}

/* page frein */
.head{display:flex;gap:18px;align-items:flex-start;margin:22px 0 22px}
.badge{width:64px;height:64px;border-radius:18px;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:26px}
.head h1{font-size:clamp(28px,4vw,42px);font-weight:800}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);border-top:5px solid var(--c)}
.card:hover{border-color:var(--c);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card h2{font-size:21px}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.card .go{margin-top:auto;font-weight:700;color:var(--accent);font-size:15px}
.cat{margin:30px 0 14px;padding-bottom:8px;border-bottom:3px solid var(--c);font-size:23px;display:flex;align-items:baseline;gap:10px}.cat .n{font-size:14px;color:var(--muted);font-weight:600}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* fiche */
.fiche{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;margin-top:8px}
@media (max-width:820px){.fiche{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h2{font-size:19px;margin-bottom:8px}
.panel section+section{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.panel ul{margin:6px 0 0;padding-left:20px}
.panel p{margin:0}
.contact{border-top:5px solid var(--c);align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (max-width:820px){.contact{position:static}}
.contact dl{margin:0;display:grid;gap:12px}
.contact dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.contact dd{margin:2px 0 0;overflow-wrap:anywhere}
.todo{color:var(--warn-ink);background:var(--warn-bg);padding:1px 8px;border-radius:6px;font-size:14px;font-style:italic}
.fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 18px}
.fh h1{font-size:clamp(28px,4vw,42px);font-weight:800;width:100%}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;background:var(--c)}
.view{animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.wheel .seg path{transition:none}}

/* Habillage visuel : pictogrammes intégrés, sans dépendance externe */
.visual-mark{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--c,#0E5E6F) 12%,var(--surface));font-size:24px;line-height:1}
.legend a{gap:10px;transition:transform .18s ease,box-shadow .18s ease}
.legend a:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(22,36,46,.08)}
.legend .dot{display:none}
.legend .visual-mark{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--icon-color,var(--accent)) 13%,var(--surface))}
.intro{gap:26px}
.intro-copy{padding:clamp(18px,3vw,30px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent) 5%,var(--surface)));box-shadow:0 12px 34px rgba(22,36,46,.05)}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-weight:700;font-size:13px}
.intro-kicker .spark{font-size:17px}
.intro h1{margin:12px 0}
.intro-lead{font-size:18px;line-height:1.55}
.card{position:relative;overflow:hidden;min-height:190px;padding:20px;gap:10px;transition:transform .18s ease,box-shadow .18s ease}
.card:after{content:"";position:absolute;width:115px;height:115px;border-radius:50%;right:-48px;top:-48px;background:color-mix(in srgb,var(--c) 8%,transparent);pointer-events:none}
.card:hover{transform:translateY(-3px)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.card .visual-mark{width:48px;height:48px;border-radius:15px;background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.card h2{margin:0}
.card .tag{margin-top:2px}
.badge{font-size:30px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.head{align-items:center}
.fh h1{display:flex;align-items:center;gap:12px}
.fiche .panel{box-shadow:0 6px 20px rgba(22,36,46,.035)}
.panel h2{display:flex;align-items:center;gap:9px}
.section-icon{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));font-size:17px;flex:none}

/* recherche rapide */

/* cartes de solutions et fiches */

const app = document.getElementById('app');
const nav = document.getElementById('nav');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todo = '<span class="todo">À compléter</span>';
const val = v => v ? esc(v) : todo;
const col = f => `var(${f.couleur})`;
const go = h => { location.hash = h; };

function route(){
  const h = location.hash.replace('#','');
  const [fid0, sid] = h.split('.');
  const [fid, cs] = fid0.split('~');
  const f = FREINS.find(x => x.id === fid);
  const s = f && sid ? f.solutions.find(x => x.id === sid) : null;
  const cc = f && cs && f.cats ? f.cats.find(x => slug(x.nom) === cs) : null;
  if (s) renderFiche(f, s);
  else if (cc) renderCatList(f, cc);
  else if (f) renderFrein(f);
  else renderHome();
  window.scrollTo(0,0);
}

function setNav(items){
  nav.hidden = !items;
  if (!items) return;
  crumbs.innerHTML = items.map((it,i) => i === items.length-1
    ? `<span class="here" aria-current="page">${esc(it.t)}</span>`
    : `<a href="#${it.h}">${esc(it.t)}</a><span class="sep">/</span>`).join(' ');
}

function wheelSVG(items, hub, label, fs, startDeg){
  items = items || FREINS.map(f => ({href:'#'+f.id, nom:f.nom, color:col(f), n:f.solutions.length}));
  hub = hub || ['Freins', "à l'emploi"]; label = label || "Roue des freins à l'emploi"; fs = fs || 15;
  const n = items.length, R = 250, r0 = 92, cx = 270, cy = 270, mx = n < 6 ? 12 : 14;
  const st = (startDeg === undefined ? -90 : startDeg) * Math.PI/180;
  const pt = (a, rad) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  const wrap=(s,m)=>{const o=[];let c='';s.split(' ').forEach(w=>{if(c&&(c+' '+w).length>m){o.push(c);c=w}else c=c?c+' '+w:w});if(c)o.push(c);return o};
  let g = '';
  items.forEach((f, i) => {
    const a0 = st + i*2*Math.PI/n + 0.012, a1 = st + (i+1)*2*Math.PI/n - 0.012;
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0);
    const d = `M${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
    const am = (a0+a1)/2, [tx,ty] = pt(am, (R+r0)/2 + 6);
    const lines = wrap(f.nom, mx), deg = am*180/Math.PI, rot = n < 6 ? 0 : (Math.cos(am) >= 0 ? deg : deg+180), lh = fs*1.13;
    const tspans = lines.map((l,k) => `<tspan x="${tx}" dy="${k===0 ? -(lines.length-1)*lh/2 : lh}">${esc(l)}</tspan>`).join('');
    g += `<a class="seg" href="${f.href}" tabindex="0" aria-label="${esc(f.nom)} : ${f.n} solutions">
      <path d="${d}" fill="${f.color}" style="transform-origin:${cx}px ${cy}px"/>
      <text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${tspans}</text></a>`;
  });
  g += `<circle class="hub" cx="${cx}" cy="${cy}" r="${r0-8}"/>
    <text class="hubtxt" x="${cx}" y="${cy-10}" text-anchor="middle" font-size="16">${esc(hub[0])}</text>
    <text class="hubtxt" x="${cx}" y="${cy+12}" text-anchor="middle" font-size="16">${esc(hub[1])}</text>`;
  return `<svg class="wheel" viewBox="0 0 540 540" role="group" aria-label="${esc(label)}">${g}</svg>`;
}

  setNav(null);
  document.title = "Roue des freins à l'emploi · Haute-Vienne";
  const totalSolutions = FREINS.reduce((n,f)=>n+f.solutions.length,0);
  app.innerHTML = `<div class="view intro">
    <div class="wheel-stage">${wheelSVG()}</div>
    <div class="intro-copy">
      <div class="intro-kicker"><span class="spark">✦</span> Outil d’orientation · Haute-Vienne</div>
      <h1>Un frein à l’emploi ?<br>Des solutions existent.</h1>
      <p class="intro-lead">Repérez la difficulté rencontrée et explorez les dispositifs, accompagnements et contacts utiles pour construire la prochaine étape du parcours.</p>
      <div class="search-panel">
        <div class="search-title"><span aria-hidden="true">🔎</span> Trouver une solution rapidement</div>
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="solution-search" type="search" placeholder="Ex. permis, logement, garde d’enfant…" autocomplete="off" aria-label="Rechercher un frein ou une solution"></label>
        <p class="search-hint">Recherchez par nom de dispositif, besoin ou mot-clé.</p>
        <div class="search-results" id="search-results" aria-live="polite"></div>
      </div>
      <ul class="legend">${FREINS.map(f => `<li><a href="#${f.id}" style="--icon-color:${col(f)}">${mark(f.id,col(f))}<span>${esc(f.nom)}</span><span class="n">${f.solutions.length}</span></a></li>`).join('')}</ul>
      <div class="note">ℹ️ Les mentions « à vérifier » signalent des coordonnées à confirmer ; les champs « À compléter » restent à renseigner avant diffusion.</div>
    </div></div>`;
  const input = document.getElementById('solution-search');
  const results = document.getElementById('search-results');
  const searchable = FREINS.flatMap(f => f.solutions.map(s => ({f,s,hay:[f.nom,s.nom,s.type,s.resume,s.presentation,(s.propose||[]).join(' '),(s.eligibilite||[]).join(' ')].join(' ').toLocaleLowerCase('fr')})));
  function updateSearch(){
    const q = input.value.trim().toLocaleLowerCase('fr');
    if(!q){results.innerHTML='';return;}
    const matches = searchable.filter(x=>x.hay.includes(q)).slice(0,7);
    results.innerHTML = matches.length ? matches.map(({f,s})=>`<a class="search-result" href="#${f.id}.${s.id}"><span class="result-icon">${iconFor(f.id)}</span><span class="result-copy"><strong>${esc(s.nom)}</strong><small>${esc(f.nom)} · ${esc(s.type)}</small></span><span class="arrow" aria-hidden="true">→</span></a>`).join('') : `<div class="search-empty">Aucun résultat exact. Essayez un autre mot ou choisissez un frein dans la liste.</div>`;
  }
  input.addEventListener('input',updateSearch);
}

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cardHTML = (f, s, c) => `<a class="card" style="--c:${c}" href="#${f.id}.${s.id}">
  <div class="card-top">${mark(f.id,c)}<div><span class="tag">${esc(s.type)}</span><h2>${esc(s.nom)}</h2></div></div>
  <p>${esc(s.resume)}</p><span class="go">Découvrir la solution <span aria-hidden="true">→</span></span></a>`;

function renderFrein(f){
  if (f.cats) return renderCats(f);
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}]);
  app.innerHTML = `<div class="view">
    <div class="head"><div class="badge" style="background:${col(f)}">${iconFor(f.id)}</div>
      <div><span class="tag">Frein périphérique</span><h1>${esc(f.nom)}</h1><p>${esc(f.intro)}</p></div></div>
    <div class="cards">${f.solutions.map(s => cardHTML(f, s, col(f))).join('')}</div></div>`;
}

function renderCats(f){
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}]);
  const items = f.cats.map(c => ({href:'#'+f.id+'~'+slug(c.nom), nom:c.nom, color:`var(${c.couleur})`, n:f.solutions.filter(s => s.cat === c.nom).length}));
  app.innerHTML = `<div class="view intro">
    <div>${wheelSVG(items, [f.nom, f.cats.length+' catégories'], f.nom+' : catégories', 20, 150)}</div>
    <div>
      <div class="eyebrow">Frein périphérique</div>
      <h1>${esc(f.nom)}</h1>
      <p>${esc(f.intro)}</p>
      <ul class="legend">${items.map(it => `<li><a href="${it.href}"><span class="dot" style="background:${it.color}"></span>${esc(it.nom)}<span class="n">${it.n}</span></a></li>`).join('')}</ul>
    </div></div>`;
}

function renderCatList(f, c){
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id},{t:c.nom,h:f.id+'~'+slug(c.nom)}]);
  const k = `var(${c.couleur})`, list = f.solutions.filter(s => s.cat === c.nom);
  app.innerHTML = `<div class="view">
    <div class="head"><div class="badge" style="background:${k}">${iconFor(f.id)}</div>
      <div><span class="tag">${esc(f.nom)} · ${list.length} fiches</span><h1>${esc(c.nom)}</h1><p>${esc(c.desc)}</p></div></div>
    <div class="cards">${list.map(s => cardHTML(f, s, k)).join('')}</div></div>`;
}

function list(arr){ return arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${todo}</p>`; }

function renderFiche(f, s){
  const cc = (f.cats||[]).find(x => x.nom === s.cat);
  setNav([{t:'Accueil',h:''},{t:f.nom,h:f.id}].concat(cc ? [{t:cc.nom,h:f.id+'~'+slug(cc.nom)}] : [], [{t:s.nom,h:`${f.id}.${s.id}`}]));
  const c = s.contact || {};
  const site = c.site ? `<a href="${esc(c.site)}" target="_blank" rel="noopener">${esc(c.site.replace(/^https?:\/\//,''))}</a>` : todo;
  app.innerHTML = `<div class="view" style="--c:${cc ? `var(${cc.couleur})` : col(f)}">
    <div class="fh"><span class="pill">${esc(cc ? f.nom+' · '+cc.nom : f.nom)}</span><span class="tag">${esc(s.type)}</span><h1>${mark(f.id,cc ? `var(${cc.couleur})` : col(f))}${esc(s.nom)}</h1></div>
    <div class="fiche">
      <article class="panel">
        <section><h2><span class="section-icon" aria-hidden="true">📖</span>Présentation du dispositif</h2><p>${val(s.presentation)}</p></section>
        <section><h2><span class="section-icon" aria-hidden="true">🧰</span>Ce qui est proposé</h2>${list(s.propose)}</section>
        <section><h2><span class="section-icon" aria-hidden="true">✅</span>Conditions d'éligibilité</h2>${list(s.eligibilite)}</section>
        <section><h2><span class="section-icon" aria-hidden="true">🧭</span>Comment y accéder</h2><p>${val(s.acces)}</p></section>
      </article>
      <aside class="panel contact">
        <h2>Contacts</h2>
        <dl>
          <div><dt>Structure</dt><dd>${val(c.structure)}</dd></div>
          <div><dt>Adresse</dt><dd>${val(c.adresse)}</dd></div>
          <div><dt>Téléphone</dt><dd>${val(c.tel)}</dd></div>
          <div><dt>Courriel</dt><dd>${val(c.mail)}</dd></div>
          <div><dt>Horaires</dt><dd>${val(c.horaires)}</dd></div>
          <div><dt>Site internet</dt><dd>${site}</dd></div>
        </dl>
      </aside>
    </div></div>`;
}

const tabSearch = document.getElementById('tab-search');
function setMobileTab(which){
  if (tabSearch) tabSearch.classList.toggle('active', which === 'search');
  const tabHome = document.getElementById('tab-home');
  if (tabHome) tabHome.classList.toggle('active', which === 'home');
}
if (tabSearch) {
  tabSearch.addEventListener('click', () => {
    if(location.hash) go('');
    setMobileTab('search');
    window.setTimeout(() => {
      const field = document.getElementById('solution-search');
      if(field){ field.scrollIntoView({behavior:'smooth',block:'center'}); field.focus({preventScroll:true}); }
    }, 80);
  });
}
const topHome = document.getElementById('home');
if (topHome) topHome.addEventListener('click', () => { go(''); setMobileTab('home'); });
const bottomHome = document.getElementById('tab-home');
if (bottomHome) bottomHome.addEventListener('click', () => { go(''); setMobileTab('home'); });
document.getElementById('back').addEventListener('click', () => {
  const [fid, sid] = location.hash.replace('#','').split('.');
  go(sid ? fid : '');
});
window.addEventListener('hashchange', () => { route(); setMobileTab(location.hash ? 'home' : 'home'); });
route();
</script>
